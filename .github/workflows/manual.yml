name: Update Subscription

on:
  schedule:
    # 每天北京时间 8:00 (UTC 0:00) 和 20:00 (UTC 12:00) 运行
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许手动触发

# 同一时间只跑一个，避免并发推送冲突
concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: write  # 必须开启写入权限以提交代码

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整历史才能安全地 rebase/reset 到 origin/main
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ---------------------------------------------------------------
      # 下载 mihomo 内核，用于「真实代理探测」
      #   runner 在墙外，能真正发起代理请求拿延迟——这是本地环境做不到的
      #   用 fixed-version 而不是 latest，避免上游改接口导致 CI 突然失败
      # ---------------------------------------------------------------
      - name: Install mihomo
        env:
          MIHOMO_VERSION: v1.19.31
        run: |
          set -euo pipefail
          mkdir -p bin
          URL="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-${MIHOMO_VERSION}.gz"
          echo "Downloading $URL"
          curl -fsSL --retry 3 --retry-delay 2 -o mihomo.gz "$URL"
          gunzip -f mihomo.gz
          mv mihomo bin/mihomo
          chmod +x bin/mihomo
          ./bin/mihomo -v

      - name: Install dependencies
        run: npm ci

      - name: Run Crawler
        env:
          # 全局测速链接：每个节点都必须通过它完成一次真实代理访问
          TEST_URL: https://www.gstatic.com/generate_204
          # 实测延迟超过该值(ms)的节点直接去除
          MAX_DELAY_MS: '350'
        run: npm run crawl

      # 抓取/探测失败时也把日志带出来，否则排查只能靠猜
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_number }}
          path: |
            output/logs/
            .probe/mihomo.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit and Push
        run: |
          set -euo pipefail
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          git add output/

          # 只有当 output 有变化时才提交
          if git diff --cached --quiet; then
            echo "No changes in output/, nothing to commit."
            exit 0
          fi

          git commit -m "chore: update nodes list [skip ci]"

          # ---------------------------------------------------------------
          # 处理 non-fast-forward：
          #   从 checkout 到 push 之间（几分钟），远端可能被其他提交推进
          #   （上一轮 Action 尚未结束、或有人在网页上直接改文件）。
          #   push 默认只允许快进，这种情况会报 "fetch first" 被拒。
          #
          #   做法：拉取远端最新，把本地这个提交「移植」到远端之上。
          #   用 reset --soft 而不是 merge/rebase，是为了：
          #     - 保留我们刚生成的 output/ 内容（工作区不动）
          #     - 不产生 merge commit，历史保持线性
          #     - 不会有 rebase 冲突中断（output/ 是我们独占的，冲突面很小）
          # ---------------------------------------------------------------
          for attempt in 1 2 3 4 5; do
            echo "--- push attempt $attempt ---"

            # 始终基于远端最新提交重建我们的提交
            git fetch origin main
            git reset --soft origin/main

            if git diff --cached --quiet; then
              echo "Remote already contains identical output/, nothing to push."
              exit 0
            fi

            git commit -m "chore: update nodes list [skip ci]"

            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi

            echo "Push rejected, retrying after remote changes..."
            sleep $((attempt * 3))
          done

          echo "::error::Failed to push after 5 attempts."
          exit 1
